<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 田小二售后服务平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 50%, #1e293b 100%);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            padding: 30px;
            text-align: center;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: #10b981;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: white;
        }

        .login-header h1 {
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 600;
            color: white;
        }

        .login-header p {
            margin: 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .login-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #334155;
            font-size: 14px;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-danger {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .login-footer {
            text-align: center;
            padding: 16px 30px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }

        .login-footer a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }

        .login-footer a:hover {
            color: #2563eb;
        }

        .copyright {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-body {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
            <image src="/static/img/tx2-logo.png"
                    
                    style="width: 80px; height: 80px;"/>
                </div>
                <h1>售后服务平台</h1>
            </div>

            <div class="login-body">
 
                {% if form.errors %}
                <div class="alert alert-danger">
                    用户名或密码错误，请重试
                </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>用户名</label>
                        <div class="input-group">
                            <i>👤</i>
                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="请输入用户名"
                                   required
                                   autofocus
                                   autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>密码</label>
                        <div class="input-group">
                            <i>🔒</i>
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="请输入密码"
                                   required
                                   autocomplete="current-password">
                        </div>
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <button type="submit" class="btn-login">
                        立即登录
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <a href="/login/">返回登录</a>
            </div>
        </div>

        <p class="copyright">
           © 2026 田小二售后服务平台
        </p>
    </div>
</body>
</html>
