{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
    :root {
        --primary-color: #2563eb;
        --sidebar-width: 260px;
    }
    
    /* 隐藏默认的admin头部 */
    #header { 
        display: none !important; 
    }
    
    /* 调整主体内容区域 */
    #content-wrapper, #content {
        margin-left: var(--sidebar-width) !important;
        padding: 20px !important;
    }
    
    /* 自定义侧边栏 */
    .custom-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--sidebar-width);
        background: linear-gradient(180deg, #1e40af 0%, #1e3a8a 100%);
        color: white;
        z-index: 9999;
        overflow-y: auto;
    }
    
    .custom-sidebar-header {
        padding: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .custom-sidebar-menu {
        padding: 15px 0;
    }
    
    .custom-menu-item {
        display: block;
        padding: 12px 20px;
        color: rgba(255,255,255,0.8);
        text-decoration: none;
        transition: all 0.2s;
        border-left: 3px solid transparent;
    }
    
    .custom-menu-item:hover, .custom-menu-item.active {
        background: rgba(255,255,255,0.1);
        color: white;
        border-left-color: #10b981;
    }
    
    .custom-menu-item i {
        margin-right: 10px;
        width: 20px;
    }
    
    /* 面包屑导航调整 */
    .breadcrumbs {
        margin-left: var(--sidebar-width) !important;
    }
    
    /* 登录页面样式 */
    body.login #header {
        display: block !important;
    }
    body.login .custom-sidebar {
        display: none !important;
    }
    body.login #content-wrapper, body.login #content {
        margin-left: 0 !important;
    }
</style>
{% endblock %}

{% block bodyclass %}{{ block.super }}{% endblock %}

{% block content %}
<!-- 自定义侧边栏 -->
<nav class="custom-sidebar">
    <div class="custom-sidebar-header">
        <h4 style="margin:0;"><i class="bi bi-gear-wide-connected"></i> 田小二</h4>
        <small style="color: rgba(255,255,255,0.7);">售后服务平台</small>
    </div>
    <div class="custom-sidebar-menu">
        <a href="/" class="custom-menu-item">
            <i class="bi bi-speedometer2"></i> 控制台
        </a>
        <a href="/admin/customers/customer/" class="custom-menu-item">
            <i class="bi bi-people"></i> 客户管理
        </a>
        <a href="/admin/faults/faultreport/" class="custom-menu-item">
            <i class="bi bi-exclamation-triangle"></i> 故障管理
        </a>
        <a href="/admin/repairs/repairorder/" class="custom-menu-item">
            <i class="bi bi-tools"></i> 返修管理
        </a>
        <a href="/admin/inventory/product/" class="custom-menu-item">
            <i class="bi bi-box-seam"></i> 库存管理
        </a>
        <a href="/admin/logistics/logisticsrecord/" class="custom-menu-item">
            <i class="bi bi-truck"></i> 物流管理
        </a>
        <a href="/admin/quotes/quote/" class="custom-menu-item">
            <i class="bi bi-currency-dollar"></i> 报价管理
        </a>
        <a href="/admin/analytics/dashboard/" class="custom-menu-item">
            <i class="bi bi-bar-chart"></i> 数据分析
        </a>
        <a href="/admin/workflows/workflowtype/" class="custom-menu-item">
            <i class="bi bi-diagram-3"></i> 流程引擎
        </a>
        <a href="/admin/ai_assistant/conversation/" class="custom-menu-item">
            <i class="bi bi-robot"></i> AI助手
        </a>
        <a href="/logout/" class="custom-menu-item" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <i class="bi bi-box-arrow-right"></i> 退出登录
        </a>
    </div>
</nav>

{{ block.super }}
{% endblock %}
