<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未授权 - 田小二售后服务平台</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .unauthorized-container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }

        .unauthorized-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .unauthorized-title {
            font-size: 28px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
        }

        .unauthorized-message {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .unauthorized-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #059669;
            color: white;
            text-decoration: none;
        }

        .btn-secondary {
            background: #64748b;
        }

        .btn-secondary:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="unauthorized-container">
        <div class="unauthorized-icon">🚫</div>
        <h1 class="unauthorized-title">未授权</h1>
        <p class="unauthorized-message">
            您没有权限访问此页面。<br>
            请联系系统管理员为您分配相应的权限。
        </p>
        <div class="unauthorized-actions">
            <a href="/" class="btn">
                <i class="bi bi-house"></i> 返回首页
            </a>
            <a href="/admin/logout/" class="btn btn-secondary">
                <i class="bi bi-box-arrow-right"></i> 重新登录
            </a>
        </div>
    </div>
</body>
</html>
