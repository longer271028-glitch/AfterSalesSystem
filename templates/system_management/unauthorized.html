{% extends "admin/base_site.html" %}

{% block page_title %}未授权{% endblock %}

{% block content %}
<style>
    .unauthorized-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
        text-align: center;
    }

    .unauthorized-content {
        background: white;
        padding: 60px 40px;
        border-radius: 16px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 500px;
    }

    .unauthorized-icon {
        font-size: 64px;
        color: #ef4444;
        margin-bottom: 24px;
    }

    .unauthorized-title {
        font-size: 24px;
        font-weight: 600;
        color: #1e293b;
        margin: 0 0 16px 0;
    }

    .unauthorized-message {
        font-size: 16px;
        color: #64748b;
        margin: 0 0 32px 0;
        line-height: 1.6;
    }

    .unauthorized-btn {
        display: inline-block;
        padding: 12px 32px;
        background: #10b981;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        transition: background 0.2s;
    }

    .unauthorized-btn:hover {
        background: #059669;
        color: white;
        text-decoration: none;
    }

    .unauthorized-contact {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid #e2e8f0;
    }

    .unauthorized-contact p {
        font-size: 14px;
        color: #94a3b8;
        margin: 0;
    }
</style>

<div class="content-card">
    <div class="unauthorized-container">
        <div class="unauthorized-content">
            <div class="unauthorized-icon">
                <i class="bi bi-shield-exclamation"></i>
            </div>
            <h1 class="unauthorized-title">未授权</h1>
            <p class="unauthorized-message">
                您没有访问此页面的权限。<br>
                系统设置页面仅超级管理员可访问。<br>
                请联系系统管理员为您分配相应的权限。
            </p>
            <a href="/" class="unauthorized-btn">
                <i class="bi bi-house"></i> 返回首页
            </a>
            <div class="unauthorized-contact">
                <p>如有疑问，请联系管理员处理</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
